[project]
name = "ya-tracker-mcp"
version = "0.1.0"
description = "MCP server for Yandex Tracker API — issues, projects, boards, sprints, worklog and more"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Daniil Pavlyuchik" },
]
keywords = ["mcp", "yandex-tracker", "tracker", "fastmcp", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0.0",
    "YaTrackerApi>=2.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/keemor/ya-tracker-mcp"
Repository = "https://github.com/keemor/ya-tracker-mcp"
Issues = "https://github.com/keemor/ya-tracker-mcp/issues"

[project.scripts]
ya-tracker-mcp = "ya_tracker_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ya_tracker_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
