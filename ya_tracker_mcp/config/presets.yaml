presets:
  bug_report:
    name: "Bug report"
    description: "Bug with reproduction steps"
    params:
      type: "bug"
      priority: "critical"
      tags: ["bug"]
    description_template: |
      ## Description
      {input.description}

      ## Steps to reproduce
      {input.steps}

      ## Expected result
      {input.expected}

      ## Actual result
      {input.actual}
    rules:
      - "Always include reproduction steps"
      - "Critical priority only if blocks release"

  feature_request:
    name: "Feature request"
    description: "New feature or improvement"
    params:
      type: "task"
      priority: "normal"
    description_template: |
      ## What needs to be done
      {input.what}

      ## Why (business value)
      {input.why}

      ## Acceptance criteria
      {input.acceptance_criteria}
    rules:
      - "Always fill 'Why' section"
      - "If task > 8 SP, decompose"

  quick_task:
    name: "Quick task"
    description: "Simple task without formal requirements"
    params:
      type: "task"
      priority: "normal"
    description_template: "{input.description}"
    rules: []

  my_task:
    name: "Задача Даниила"
    description: "Личная задача руководителя с авто-привязкой к BLESK-67"
    params:
      type: "task"
      priority: "normal"
      assignee: "imdeniil"
    description_template: |
      **Суть:** {input.description}

      **Зачем:** {input.why}

      **Ожидаемый результат:** {input.result}
    rules:
      - "После создания привязать как подзадачу к BLESK-67"
      - "Установить Флагман: imdeniil"
      - "Установить проект: JUMMY (303)"
      - "Определить компонент по контексту задачи"
      - "Дедлайн — конец текущей недели если не указан"
      - "Дата начала — начало текущей недели если не указана"
      - "Тип задачи определять по контексту: meeting для созвонов, bug для багов, research для исследований, review для ревью"
